[tox]
requires =
    tox-uv>=1.0
    tox-gh-actions>=3.0
env_list =
    py{310,311,312}-django42
    py{310,311,312,313}-django52
    py{312,313,314}-django60
    lint
    pyrefly
    docs
    coverage
skip_missing_interpreters = true

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

# ── Test matrix ──────────────────────────────────────────────

[testenv]
description = Run tests under {base_python} with {env_name}
deps =
    .[tests]
    django42: django>=4.2,<5.0
    django52: django>=5.2,<6.0
    django60: django>=6.0,<6.1
commands =
    pytest --cov-report= {posargs}
set_env =
    COVERAGE_FILE = {toxworkdir}/.coverage.{env_name}

# ── Lint ─────────────────────────────────────────────────────

[testenv:lint]
description = Lint and check formatting with ruff
skip_install = true
deps = ruff>=0.15.0
commands =
    ruff check django_statsd tests
    ruff format --check django_statsd tests

# ── Type checking ────────────────────────────────────────────

[testenv:pyrefly]
description = Type-check with pyrefly
deps =
    .[tests]
    django-stubs[compatible-mypy]>=5.1
    pyrefly>=0.1
commands =
    pyrefly check

[testenv:mypy]
description = Type-check with mypy + django-stubs
deps = .[dev]
commands =
    mypy

[testenv:basedpyright]
description = Type-check with basedpyright
deps = .[dev]
commands =
    basedpyright

[testenv:ty]
description = Type-check with ty (run explicitly: tox -e ty)
deps =
    .
    ty
commands =
    ty check django_statsd

# ── Docs ─────────────────────────────────────────────────────

[testenv:docs]
description = Build Sphinx documentation
deps = .[docs]
commands =
    sphinx-build -W -b html -d {env_tmp_dir}/doctrees docs {env_tmp_dir}/html

# ── Coverage ─────────────────────────────────────────────────

[testenv:coverage]
description = Combine coverage from test envs and enforce threshold
skip_install = true
deps = coverage>=7.0
depends =
    py{310,311,312}-django42
    py{310,311,312,313}-django52
    py{312,313,314}-django60
set_env =
    COVERAGE_FILE = {toxworkdir}/.coverage
commands =
    coverage combine {toxworkdir}
    coverage report --fail-under=100
