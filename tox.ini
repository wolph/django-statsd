[tox]
requires =
    tox-uv>=1.0
    tox-gh-actions>=3.0
env_list =
    py{310,311,312,313}-django52
    py{312,313,314}-django60
    py{312,313,314}-django61
    lint
    mypy
    basedpyright
    pyrefly
    ty
    docs
    coverage
skip_missing_interpreters = true

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

# ── Test matrix ──────────────────────────────────────────────

[testenv]
description = Run tests under {base_python} with {env_name}
deps =
    .[tests]
    django52: django>=5.2,<6.0
    django60: django>=6.0,<6.1
    django61: django>=6.1,<6.2
commands =
    pytest --cov-report= {posargs}
set_env =
    COVERAGE_FILE = {toxworkdir}/.coverage.{env_name}

# ── Lint ─────────────────────────────────────────────────────

[testenv:lint]
description = Lint and check formatting with ruff
skip_install = true
deps = ruff==0.16.5
commands =
    ruff check django_statsd tests
    ruff format --check django_statsd tests

# ── Type checking ────────────────────────────────────────────

# Checker versions are pinned for CI stability; bump deliberately.
# Pins stay inside the 14-day quarantine set by [tool.uv] exclude-newer,
# so tox resolves the same versions uv does.
# django-stubs[compatible-mypy] picks the mypy release it was built
# against, so mypy itself is pinned transitively rather than here.

[testenv:mypy]
description = Type-check with mypy + django-stubs
deps =
    .[tests]
    django-stubs[compatible-mypy]==6.1.0
commands =
    mypy

[testenv:basedpyright]
description = Type-check with basedpyright
deps =
    .[tests]
    basedpyright==1.39.10
    django-stubs==6.1.0
commands =
    # Without --pythonpath, basedpyright resolves imports against
    # whatever interpreter it finds rather than this env, so celery and
    # redis go missing wherever the ambient venv lacks them.
    basedpyright --pythonpath {env_python}

[testenv:pyrefly]
description = Type-check with pyrefly
deps =
    .[tests]
    pyrefly==1.2.0
    django-stubs==6.1.0
commands =
    pyrefly check

[testenv:ty]
description = Type-check with ty
deps =
    .[tests]
    ty==0.0.75
    django-stubs==6.1.0
commands =
    ty check django_statsd

# ── Docs ─────────────────────────────────────────────────────

[testenv:docs]
description = Build Sphinx documentation
deps = .[docs]
commands =
    sphinx-build -W -b html -d {env_tmp_dir}/doctrees docs {env_tmp_dir}/html

# ── Coverage ─────────────────────────────────────────────────

[testenv:coverage]
description = Combine coverage from test envs and enforce threshold
skip_install = true
deps = coverage>=7.0
depends =
    py{310,311,312,313}-django52
    py{312,313,314}-django60
    py{312,313,314}-django61
set_env =
    COVERAGE_FILE = {toxworkdir}/.coverage
commands =
    coverage combine {toxworkdir}
    coverage report --fail-under=100
