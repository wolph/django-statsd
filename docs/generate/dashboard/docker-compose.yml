# Brought up by docs/generate/dashboard.py to record the screenshot in
# the README. Nothing here ships with django-statsd.
services:
  graphite:
    image: graphiteapp/graphite-statsd:1.1.10-5
    # Uncommon host ports: 8125 and 3000 are exactly the ports another
    # statsd or Grafana on this machine will already be using.
    ports:
      - '18280:80'
      - '18225:8125/udp'
    environment:
      GRAPHITE_TIME_ZONE: UTC

  grafana:
    image: grafana/grafana:11.6.1
    depends_on:
      - graphite
    ports:
      - '13200:3000'
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: 'true'
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: 'true'
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./provisioning:/etc/grafana/provisioning:ro
