apiVersion: 1
datasources:
  - name: Graphite
    # Pinned so the dashboard JSON can reference it. Without a uid here
    # Grafana invents one and every panel reports "No data".
    uid: graphite
    type: graphite
    access: proxy
    url: http://graphite:80
    isDefault: true
    jsonData:
      graphiteVersion: '1.1'
