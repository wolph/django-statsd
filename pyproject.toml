[build-system]
requires = ["uv_build>=0.11.0,<0.13"]
build-backend = "uv_build"

[project]
name = "django-statsd"
version = "3.0.0"
description = "Django app that submits query and view durations to statsd."
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Rick van Hattem", email = "Wolph@Wol.ph" }]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Framework :: Django :: 6.1",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "asgiref>=3.6",
    "django>=5.2",
    "python-statsd>=2.1",
]

[project.urls]
Homepage = "https://github.com/WoLpH/django-statsd/"
Documentation = "https://django-stats.readthedocs.io/"
Changelog = "https://github.com/WoLpH/django-statsd/blob/master/CHANGELOG.md"

[project.optional-dependencies]
docs = [
    "sphinx>=8.0",
    "furo>=2025.1",
]
tests = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=6.0",
    "coverage>=7.0",
    "celery>=5.3",
    "redis>=5.0",
]
dev = [
    "django-statsd[tests]",
    "ruff>=0.15.0",
    "mypy>=1.14",
    "django-stubs[compatible-mypy]>=5.1",
    "basedpyright>=1.0",
    "pyrefly>=0.1",
    "ty>=0.0.1",
]
tox = [
    "tox>=4.0",
    "tox-uv>=1.0",
    "tox-gh-actions>=3.0",
]

[tool.uv.build-backend]
module-root = ""
module-name = "django_statsd"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "--cov=django_statsd",
    "--cov-report=term-missing",
    "--no-cov-on-fail",
]

[tool.coverage.run]
branch = true
source = ["django_statsd"]

[tool.mypy]
packages = ["django_statsd"]
plugins = ["mypy_django_plugin.main"]
strict = true
local_partial_types = true
enable_error_code = [
    "exhaustive-match",
    "ignore-without-code",
    "redundant-expr",
    "truthy-bool",
]
warn_return_any = false

[tool.django-stubs]
django_settings_module = "tests.settings"

[[tool.mypy.overrides]]
module = ["statsd.*", "celery.*"]
ignore_missing_imports = true

[tool.pyright]
pythonPlatform = "All"
include = ["django_statsd"]
ignore = [".venv"]
typeCheckingMode = "strict"
# python-statsd and celery ship no type information; silence the unknown-
# type fallout instead of writing stubs for them.
reportMissingTypeStubs = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownVariableType = false
# request.statsd is a documented dynamic attribute set by the middleware.
reportAttributeAccessIssue = false

[tool.pyrefly]
project-includes = ["django_statsd"]
ignore-missing-imports = ["statsd", "celery", "celery.*"]

[tool.uv]
exclude-newer = "14 days"
